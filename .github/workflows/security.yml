name: Security

on:
  pull_request:
    branches:
      - master
      - 'version/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA...$PR_HEAD_SHA" | grep -Eq '(^|/)(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|requirements\.txt|pyproject\.toml|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum)$'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Dependency manifests changed; running dependency review.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency manifests changed; dependency review is not applicable.'
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Review dependency changes
        if: steps.manifests.outputs.present == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
