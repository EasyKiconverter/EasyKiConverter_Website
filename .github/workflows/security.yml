name: Security

on:
  pull_request:
    branches:
      - master
      - 'version/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA...$PR_HEAD_SHA" | grep -Eq '(^|/)(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|requirements\.txt|pyproject\.toml|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum)$'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Dependency manifests changed; running dependency review.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency manifests changed; dependency review is not applicable.'
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        if: steps.manifests.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Set up pnpm
        if: steps.manifests.outputs.present == 'true'
        run: corepack enable && corepack install --global pnpm@10.34.5

      - name: Audit dependency lockfile
        if: steps.manifests.outputs.present == 'true'
        run: pnpm audit --audit-level=moderate
