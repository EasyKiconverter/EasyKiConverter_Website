# EasyKiConverter Website deployment for easykiconverter.org.cn.
# easykiconverter.org.cn 部署配置。

server {
    listen 80;
    server_name easykiconverter.org.cn www.easykiconverter.org.cn;

    root /var/www/easykiconverter-website;
    index index.html;

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Preserve legacy root-level download URLs / 保留旧版根路径下载链接。
    location ~* ^/(?<legacy_download>EasyKiConverter-[^/]+\.(?:msix|exe|msi|zip|tar|gz|rar))$ {
        alias /var/www/downloads/$legacy_download;
        add_header Content-Disposition 'attachment';
        add_header Content-Type 'application/octet-stream';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css;
    gzip_min_length 512;
}

server {
    listen 8443 ssl;
    server_name easykiconverter.org.cn www.easykiconverter.org.cn;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/easykiconverter-website;
    index index.html;

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Preserve legacy root-level download URLs / 保留旧版根路径下载链接。
    location ~* ^/(?<legacy_download>EasyKiConverter-[^/]+\.(?:msix|exe|msi|zip|tar|gz|rar))$ {
        alias /var/www/downloads/$legacy_download;
        add_header Content-Disposition 'attachment';
        add_header Content-Type 'application/octet-stream';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css;
    gzip_min_length 512;
}
